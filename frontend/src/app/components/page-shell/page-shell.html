<section class="page">
  @if (backLink(); as link) {
    <a [routerLink]="link" class="back">← {{ backLabel() }}</a>
  }

  <header class="head">
    <div>
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p class="muted">{{ subtitle() }}</p>
      }
    </div>
    <div class="actions"><ng-content select="[actions]" /></div>
  </header>

  <ng-content />
</section>
